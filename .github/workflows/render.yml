name: Render video (cloud)

# Render a TikTok video on GitHub's servers instead of your PC.
# Trigger: Actions tab → "Render video (cloud)" → Run workflow → enter job_dir.
# Result: download the "video-<run>" artifact (video.mp4 + voice.mp3 + script.txt).

on:
  workflow_dispatch:
    inputs:
      job_dir:
        description: "Folder holding script.json (e.g. jobs/antidetect-vs-vpn)"
        required: true
        default: "jobs/antidetect-vs-vpn"
      tts:
        description: "Giọng đọc: edge (free) | lucylab | elevenlabs"
        required: false
        default: "edge"
      broll:
        description: "Hình nền minh hoạ (b-roll Pexels theo nội dung): 1 = bật, 0 = tắt"
        required: false
        default: "1"
      images:
        description: "Ảnh AI khớp lời nói (Pollinations, miễn phí, render NHẸ): 1 = bật, 0 = tắt. Bật sẽ tự TẮT b-roll video."
        required: false
        default: "0"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        # npm install (not ci): the committed lock file was generated on Windows
        # and misses some Linux-only optional WASM variants (@emnapi/*), which
        # npm ci rejects. npm install resolves them per-platform.
        run: npm install --no-audit --no-fund

      - name: Install Chromium (for hyperframes)
        run: npx playwright install --with-deps chromium

      - name: Install edge-tts (free voice)
        run: python3 -m pip install --quiet edge-tts

      - name: Render pipeline
        env:
          TTS_PROVIDER: ${{ github.event.inputs.tts }}
          EDGE_VOICE: vi-VN-NamMinhNeural
          VIETNAMESE_API_KEY: ${{ secrets.VIETNAMESE_API_KEY }}
          VIETNAMESE_VOICEID: ${{ secrets.VIETNAMESE_VOICEID }}
          # B-roll minh hoạ: Pexels footage (miễn phí) + Gemini khớp nội dung từng cảnh.
          # Tự bật khi PEXELS_API_KEY secret được set; thiếu key → tự bỏ qua, dựng nền gradient như cũ.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BROLL_ENABLED: ${{ github.event.inputs.broll }}
          # Ảnh AI khớp lời nói (Pollinations, không cần key). Bật = tự tắt b-roll
          # video (ảnh tĩnh render nhẹ, chạy được trên runner free 2-nhân).
          AI_IMAGES: ${{ github.event.inputs.images }}
          VIETVIRAL_RENDER_QUALITY: high
          VIETVIRAL_RENDER_FPS: "60"
          # Slightly slower speech for a calmer, more natural storytelling pace.
          VOICE_SPEED: "0.95"
          # Background-music volume under the voice (playful-mystery bed).
          BGM_VOLUME: "0.12"
        run: npm run pipeline -- "${{ github.event.inputs.job_dir }}/script.json"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ github.event.inputs.job_dir }}/video.mp4
            ${{ github.event.inputs.job_dir }}/voice.mp3
            ${{ github.event.inputs.job_dir }}/script.txt
